name: CI

permissions:
    contents: read

on:
    pull_request:
        branches: [ main ]
        types: [ opened, synchronize, reopened, ready_for_review ]
    push:
        branches: [ main ]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
    # CI 优化：禁用增量编译，减少 test profile 的调试信息，减小缓存体积/加快构建
    CARGO_INCREMENTAL: 0
    CARGO_PROFILE_TEST_DEBUG: 0
    # 在主分支的 lint/test/doc 阶段直接把所有编译/文档警告当成 error
    RUSTFLAGS: -Dwarnings
    RUSTDOCFLAGS: -Dwarnings

jobs:
    lint:
        name: fmt + clippy (workspace)
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            -   uses: actions/checkout@v6

            -   name: Install Rust (from rust-toolchain.toml)
                uses: actions-rust-lang/setup-rust-toolchain@v1
                with:
                    cache: true
                    rustflags: ""

            -   name: cargo fmt --check
                run: cargo fmt --all -- --check

            -   name: cargo clippy (deny warnings)
                run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

    test:
        name: test (${{ matrix.os }}, nextest)
        needs: [ lint ]
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, macos-latest, windows-latest ]

        runs-on: ${{ matrix.os }}
        timeout-minutes: 60

        steps:
            -   uses: actions/checkout@v6

            -   name: Install Rust (from rust-toolchain.toml)
                uses: actions-rust-lang/setup-rust-toolchain@v1
                with:
                    cache: true
                    rustflags: ""

            -   name: Install cargo-nextest
                uses: taiki-e/install-action@nextest

            -   name: tests (no default features)
                run: cargo nextest run --workspace --all-targets --no-default-features --locked --no-tests=warn

            -   name: tests (all features)
                run: cargo nextest run --workspace --all-targets --all-features --locked --no-tests=warn

    # 3. 文档构建，确保 docs.rs 风格的文档可以正常生成
    doc:
        name: doc + doctest (workspace)
        needs: [ lint ]
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            -   uses: actions/checkout@v6

            -   name: Install Rust (from rust-toolchain.toml)
                uses: actions-rust-lang/setup-rust-toolchain@v1
                with:
                    cache: true
                    rustflags: ""

            -   name: cargo doc (deny warnings)
                run: cargo doc --workspace --all-features --no-deps --locked --verbose

            -   name: doctests
                run: cargo test --doc --workspace --all-features --locked

    msrv:
        name: MSRV check
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            RUSTFLAGS: ""
            RUSTDOCFLAGS: ""

        steps:
            -   uses: actions/checkout@v6

            -   name: Install Rust (MSRV)
                uses: actions-rust-lang/setup-rust-toolchain@v1
                with:
                    cache: true
                    rustflags: ""

            -   name: cargo check (MSRV)
                run: cargo check --workspace --all-features --locked
