name: Publish crates (u-sdk workspace)

permissions:
    contents: read
    id-token: write

on:
    workflow_dispatch:
        inputs:
            target:
                description: "选择要发布的 crate"
                required: true
                default: "u-sdk"
                type: choice
                options:
                    - u-sdk
                    - u-sdk-common
                    - both

concurrency:
    group: publish-crates
    cancel-in-progress: false

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
    # ci 环境不需要增量编译
    CARGO_INCREMENTAL: 0

jobs:
    publish:
        name: Publish ${{ inputs.target }} to crates.io
        if: github.ref == 'refs/heads/main'
        environment: release
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            -   uses: actions/checkout@v6

            -   name: Install Rust (from rust-toolchain.toml)
                uses: actions-rust-lang/setup-rust-toolchain@v1
                with:
                    cache: true
                    rustflags: ""

            -   name: Dry run publish u-sdk-common
                if: inputs.target == 'both' || inputs.target == 'u-sdk-common'
                run: cargo publish -p u-sdk-common --dry-run --locked

            # https://crates.io/docs/trusted-publishing
            -   name: Authenticate with crates.io
                id: auth
                uses: rust-lang/crates-io-auth-action@v1

            -   name: Publish u-sdk-common
                if: inputs.target == 'both' || inputs.target == 'u-sdk-common'
                env:
                    CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
                run: cargo publish -p u-sdk-common --locked

            -   name: Wait for u-sdk-common to become available
                if: inputs.target == 'both'
                shell: bash
                run: |
                    version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "u-sdk-common") | .version')
                    for attempt in {1..12}; do
                        if curl --fail --silent "https://index.crates.io/u-/sd/u-sdk-common" \
                            | jq --exit-status --arg version "${version}" 'select(.vers == $version)' > /dev/null; then
                            echo "u-sdk-common ${version} is available"
                            exit 0
                        fi
                        echo "Waiting for u-sdk-common ${version} (${attempt}/12)"
                        sleep 10
                    done
                    echo "::error::u-sdk-common ${version} is not available after 120 seconds"
                    exit 1

            -   name: Dry run publish u-sdk
                if: inputs.target == 'both' || inputs.target == 'u-sdk'
                run: cargo publish -p u-sdk --dry-run --locked

            -   name: Publish u-sdk
                if: inputs.target == 'both' || inputs.target == 'u-sdk'
                env:
                    CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
                run: cargo publish -p u-sdk --locked
